<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workflow · Signal</title>
<link rel="stylesheet" href="assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: {
      extend: {
        colors: {
          border: 'var(--border)', input: 'var(--input)', ring: 'var(--ring)',
          background: 'var(--background)', foreground: 'var(--foreground)',
          primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
          secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
          muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
          accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
          destructive: { DEFAULT: 'var(--destructive)', foreground: 'var(--destructive-foreground)' },
          card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
        },
        borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Fraunces', 'serif'] },
      }
    }
  }
</script>

</head>
<body data-page="workflow" data-title="Content Workflow" data-sub="Drag posts across stages, from draft to published">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar-root"></header>

      <main class="content">
        <div class="flex items-center justify-between mb-20">
          <select class="select" style="width:220px;" id="projectFilter">
            <option value="all">All projects</option>
          </select>
          <span class="text-sm text-muted">Drag a card to move it to the next stage</span>
        </div>

        <div class="kanban" id="kanbanBoard"></div>
      </main>
    </div>
  </div>

  <style>
    .kanban{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; align-items:flex-start; }
    .kanban-col{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-l); padding:14px; min-height:200px; }
    .kanban-col.drag-over{ background:var(--brass-glow); border-color:var(--brass); }
    .kanban-col-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px; }
    .kanban-col-title{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; }
    .kanban-count{ font-size:11.5px; color:var(--text-3); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:1px 8px; }
    .kcard{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:13px; margin-bottom:10px; cursor:grab; box-shadow:var(--shadow-card); }
    .kcard:active{ cursor:grabbing; }
    .kcard.dragging{ opacity:0.4; }
    .kcard-title{ font-size:13px; font-weight:600; line-height:1.4; margin-bottom:8px; }
    @media (max-width:1080px){ .kanban{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:640px){ .kanban{ grid-template-columns:1fr; } }
  </style>

  <script src="assets/data.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.getElementById('projectFilter').innerHTML += PROJECTS.map(p => `<option value="${p.id}">${p.title}</option>`).join('');

    const COLUMNS = [
      { key:'draft', label:'Draft', dot:'draft' },
      { key:'review', label:'Pending review', dot:'review' },
      { key:'ready', label:'Ready', dot:'ready' },
      { key:'scheduled', label:'Scheduled / Published', dot:'scheduled' },
    ];

    let posts = GENERATED_POSTS.map(p => ({...p, status: p.status === 'published' ? 'scheduled' : p.status, published: p.status === 'published'}));

    function kcard(p){
      const proj = projectById(p.project);
      const sp = styleProfileById(p.styleProfile);
      return `
        <div class="kcard" draggable="true" data-id="${p.id}" ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">
          <div class="kcard-title">${p.title}</div>
          <div class="flex gap-6 mb-8" style="flex-wrap:wrap;">
            <span class="tag" style="font-size:10.5px;">${proj.title}</span>
            ${p.published ? '<span class="tag tag-teal" style="font-size:10.5px;">Published</span>' : ''}
          </div>
          <div class="flex items-center justify-between">
            <span class="dna-badge" style="padding:3px 8px 3px 4px;"><span class="strand" data-strand data-traits='${JSON.stringify(sp.traits)}' style="width:34px;"></span></span>
            <span class="text-xs text-muted">${p.updated}</span>
          </div>
        </div>
      `;
    }

    function render(){
      const filter = document.getElementById('projectFilter').value;
      const visible = filter === 'all' ? posts : posts.filter(p => p.project === filter);
      document.getElementById('kanbanBoard').innerHTML = COLUMNS.map(col => {
        const items = visible.filter(p => p.status === col.key);
        return `
          <div class="kanban-col" data-status="${col.key}" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
            <div class="kanban-col-head">
              <span class="kanban-col-title"><span class="status-dot ${col.dot}"></span>${col.label}</span>
              <span class="kanban-count">${items.length}</span>
            </div>
            ${items.map(kcard).join('') || '<div class="text-xs text-muted" style="padding:8px 4px;">No posts here</div>'}
          </div>
        `;
      }).join('');
      renderStrands();
    }
    render();
    document.getElementById('projectFilter').addEventListener('change', render);

    let draggedId = null;
    function onDragStart(e){
      draggedId = e.target.closest('.kcard').getAttribute('data-id');
      e.target.classList.add('dragging');
    }
    function onDragEnd(e){ e.target.classList.remove('dragging'); }
    function onDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e){
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const status = e.currentTarget.getAttribute('data-status');
      const post = posts.find(p => p.id === draggedId);
      if(post){
        post.status = status;
        post.updated = 'just now';
        toast(`Moved "${post.title.slice(0,40)}…" to ${COLUMNS.find(c=>c.key===status).label}`);
      }
      render();
    }
  </script>
</body>
</html>
