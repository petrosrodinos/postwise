<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organisation Settings · Signal</title>
<link rel="stylesheet" href="assets/styles.css" />

</head>
<body data-page="settings" data-title="Organisation Settings" data-sub="">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar-root"></header>

      <main class="content">

        <div id="orgHeader"></div>
        <div id="generalPanel"></div>

      </main>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const ws = getActiveWorkspace();

    document.getElementById('orgHeader').innerHTML = `
      <a href="index.html" class="text-sm text-muted" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;">← Back to dashboard</a>
      <div class="flex items-start justify-between" style="flex-wrap:wrap; gap:16px;">
        <div class="flex items-center gap-14">
          <div class="avatar" style="width:44px; height:44px; font-size:15px; border-radius:12px;">${initials(ws.name)}</div>
          <div>
            <div class="flex items-center gap-8 mb-4">
              <h1 style="font-size:22px;">${ws.name}</h1>
              ${ws.kind==='organisation' ? '<span class="tag tag-brass">Organisation</span>' : '<span class="tag">Personal account</span>'}
            </div>
            <p class="text-muted">${ws.kind==='organisation' ? 'Private workspace for your brand-level content' : 'Not part of a shared workspace'}</p>
          </div>
        </div>
      </div>
    `;

    document.getElementById('generalPanel').innerHTML = `
      <div class="card card-pad mt-28" style="max-width:640px;">
        <div class="field"><label>Organisation name</label><input class="input" id="orgNameInput" value="${ws.name}" /></div>
        <div class="field">
          <label>Slug <span class="text-muted" style="font-weight:400;">— used in shareable links</span></label>
          <input class="input" value="acme-inc" />
        </div>
        <hr class="divider" />
        <div class="flex items-center justify-between">
          <div>
            <div style="font-weight:600; font-size:14px; color:var(--coral);">Delete organisation</div>
            <div class="text-xs text-muted" style="max-width:420px;">Permanently deletes ${ws.name} along with its posts, brand assets and connected channels. This cannot be undone.</div>
          </div>
          <button class="btn btn-danger-ghost btn-sm">Delete</button>
        </div>
      </div>
      <p class="text-xs text-muted mt-16" style="max-width:640px;">This Organisation is private to your account — multi-person collaboration isn't available yet.</p>
    `;
  </script>
</body>
</html>
