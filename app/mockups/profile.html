<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile · Signal</title>
<link rel="stylesheet" href="assets/styles.css" />

</head>
<body data-page="profile" data-title="My Profile" data-sub="">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar-root"></header>

      <main class="content">

        <div id="profileHeader"></div>

        <div data-tabs="profileTabScope" class="tabs mt-24">
          <button class="tab is-active" data-tab-target="info">Personal info</button>
          <button class="tab" data-tab-target="password">Change password</button>
        </div>

        <div id="profileTabScope">
          <div data-tab-panel="info"></div>
          <div data-tab-panel="password" style="display:none;"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/app.js"></script>
  <script>
    document.getElementById('profileHeader').innerHTML = `
      <a href="index.html" class="text-sm text-muted" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:18px;">← Back to dashboard</a>
      <div class="flex items-center gap-14">
        <div class="avatar" style="width:44px; height:44px; font-size:15px; border-radius:12px;">${initials(CURRENT_USER.name)}</div>
        <div>
          <h1 style="font-size:22px; margin-bottom:4px;">My profile</h1>
          <p class="text-muted">Manage your personal info and password</p>
        </div>
      </div>
    `;

    document.querySelector('[data-tab-panel="info"]').innerHTML = `
      <div class="card card-pad mt-4" style="max-width:520px;">
        <div class="field"><label>Full name</label><input class="input" id="profileNameInput" value="${CURRENT_USER.name}" /></div>
        <div class="field" style="margin-bottom:0;"><label>Email</label><input class="input" type="email" id="profileEmailInput" value="${CURRENT_USER.email}" /></div>
        <div class="flex mt-16" style="justify-content:flex-end;">
          <button class="btn btn-brass" id="saveInfoBtn">Save changes</button>
        </div>
      </div>
    `;

    document.querySelector('[data-tab-panel="password"]').innerHTML = `
      <div class="card card-pad mt-4" style="max-width:520px;">
        <p class="text-xs text-muted mb-16">Updates immediately — no confirmation email is sent.</p>
        <div class="field"><label>Current password</label><input class="input" type="password" id="currentPasswordInput" placeholder="Enter your current password" /></div>
        <div class="field"><label>New password</label><input class="input" type="password" id="newPasswordInput" placeholder="At least 8 characters" /></div>
        <div class="field" style="margin-bottom:0;"><label>Confirm new password</label><input class="input" type="password" id="confirmPasswordInput" placeholder="Re-enter new password" /></div>
        <div class="flex mt-16" style="justify-content:flex-end;">
          <button class="btn btn-brass" id="updatePasswordBtn">Update password</button>
        </div>
      </div>
    `;

    document.getElementById('saveInfoBtn').addEventListener('click', () => {
      const name = document.getElementById('profileNameInput').value.trim();
      const email = document.getElementById('profileEmailInput').value.trim();
      if(!name || !email){
        toast('Name and email are required.');
        return;
      }
      CURRENT_USER.name = name;
      CURRENT_USER.email = email;
      toast('Profile updated.');
    });

    document.getElementById('updatePasswordBtn').addEventListener('click', () => {
      const current = document.getElementById('currentPasswordInput').value;
      const next = document.getElementById('newPasswordInput').value;
      const confirm = document.getElementById('confirmPasswordInput').value;
      if(!current || !next || !confirm){
        toast('Fill in all three password fields.');
        return;
      }
      if(next.length < 8){
        toast('New password must be at least 8 characters.');
        return;
      }
      if(next !== confirm){
        toast('New password and confirmation don\'t match.');
        return;
      }
      document.getElementById('currentPasswordInput').value = '';
      document.getElementById('newPasswordInput').value = '';
      document.getElementById('confirmPasswordInput').value = '';
      toast('Password updated.');
    });
  </script>
</body>
</html>
