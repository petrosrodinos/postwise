<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar · Signal</title>
<link rel="stylesheet" href="assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: {
      extend: {
        colors: {
          border: 'var(--border)', input: 'var(--input)', ring: 'var(--ring)',
          background: 'var(--background)', foreground: 'var(--foreground)',
          primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
          secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
          muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
          accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
          destructive: { DEFAULT: 'var(--destructive)', foreground: 'var(--destructive-foreground)' },
          card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
        },
        borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Fraunces', 'serif'] },
      }
    }
  }
</script>

</head>
<body data-page="calendar" data-title="Content Calendar" data-sub="September 2026">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar-root"></header>

      <main class="content">
        <div class="flex items-center justify-between mb-20">
          <div class="flex items-center gap-12">
            <button class="icon-btn">‹</button>
            <h2 style="font-size:18px;">September 2026</h2>
            <button class="icon-btn">›</button>
          </div>
          <div class="flex items-center gap-10">
            <div class="flex gap-14 text-xs text-muted" style="align-items:center;">
              <span class="flex items-center gap-6"><span class="status-dot draft"></span>Draft</span>
              <span class="flex items-center gap-6"><span class="status-dot ready"></span>Ready</span>
              <span class="flex items-center gap-6"><span class="status-dot scheduled"></span>Scheduled</span>
              <span class="flex items-center gap-6"><span class="status-dot published"></span>Published</span>
            </div>
            <div class="pill-tabs">
              <button class="is-active" onclick="setView('month', this)">Month</button>
              <button onclick="setView('week', this)">Week</button>
              <button onclick="setView('list', this)">List</button>
            </div>
          </div>
        </div>

        <div id="monthView" class="card" style="padding:16px;">
          <div class="cal-grid cal-head">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-daylabel">${d}</div>`).join('')}
          </div>
          <div class="cal-grid" id="calBody"></div>
        </div>

        <div id="listView" class="card card-pad" style="display:none;">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Date</th><th>Post</th><th>Project</th><th>Status</th></tr></thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Day drawer -->
  <div class="drawer-overlay" id="dayOverlay"></div>
  <div class="drawer" id="dayDrawer">
    <div id="dayDrawerContent"></div>
  </div>

  <style>
    .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .cal-head{ margin-bottom:8px; }
    .cal-daylabel{ font-size:11px; font-weight:700; color:var(--text-3); text-align:center; padding:4px 0; }
    .cal-cell{ min-height:96px; border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--surface-2); cursor:pointer; }
    .cal-cell:hover{ border-color:var(--line-strong); background:var(--surface); }
    .cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
    .cal-date{ font-size:12px; font-weight:700; color:var(--text-2); margin-bottom:6px; }
    .cal-chip{ font-size:10.5px; font-weight:600; padding:3px 6px; border-radius:6px; background:var(--surface); border:1px solid var(--line); margin-bottom:4px; display:flex; align-items:center; gap:5px; line-height:1.3; }
  </style>

  <script src="assets/data.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const statusLabel = { draft:'Draft', review:'Pending review', ready:'Ready', scheduled:'Scheduled', published:'Published' };
    const firstWeekday = 2; // Sept 1, 2026 is a Tuesday
    const daysInMonth = 30;

    function postsOnDay(day){ return CALENDAR_POSTS.filter(p => p.day === day); }

    let cells = '';
    for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const items = postsOnDay(d);
      cells += `
        <div class="cal-cell" onclick="showDay(${d})">
          <div class="cal-date">${d}</div>
          ${items.slice(0,2).map(p => `<div class="cal-chip"><span class="status-dot ${p.status}"></span>${p.title.slice(0,26)}${p.title.length>26?'…':''}</div>`).join('')}
          ${items.length>2 ? `<div class="text-xs text-muted">+${items.length-2} more</div>` : ''}
        </div>
      `;
    }
    document.getElementById('calBody').innerHTML = cells;

    document.getElementById('listBody').innerHTML = CALENDAR_POSTS.slice().sort((a,b)=>a.day-b.day).map(p => `
      <tr>
        <td class="cell-muted">Sep ${p.day}</td>
        <td class="cell-strong">${p.title}</td>
        <td class="cell-muted">${p.project}</td>
        <td><span class="tag"><span class="status-dot ${p.status}"></span> ${statusLabel[p.status]}</span></td>
      </tr>
    `).join('');

    function setView(view, btn){
      btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('is-active'));
      btn.classList.add('is-active');
      document.getElementById('monthView').style.display = view==='month' ? 'block' : 'none';
      document.getElementById('listView').style.display = view==='list' ? 'block' : 'none';
      if(view==='week') toast('Week view is coming soon — showing Month view for now.');
    }

    function showDay(day){
      const items = postsOnDay(day);
      document.getElementById('dayDrawerContent').innerHTML = `
        <div class="drawer-head">
          <div><div class="text-xs text-muted mb-4">September ${day}, 2026</div><h2 style="font-size:19px;">${items.length} post${items.length===1?'':'s'} scheduled</h2></div>
          <button class="modal-close" onclick="closeDrawer('dayOverlay','dayDrawer')">✕</button>
        </div>
        <div class="drawer-body">
          ${items.length ? items.map(p => `
            <div class="card card-pad mb-12" style="box-shadow:none;">
              <div class="flex items-center justify-between mb-8">
                ${platformGlyph(p.platform)}
                <span class="tag"><span class="status-dot ${p.status}"></span> ${statusLabel[p.status]}</span>
              </div>
              <div class="text-sm" style="font-weight:600; margin-bottom:6px;">${p.title}</div>
              <div class="text-xs text-muted">${p.project}</div>
            </div>
          `).join('') : `<div class="empty"><h3>Nothing scheduled</h3><p>Generate content or drag a draft here from the workflow board.</p><a href="ai-generation.html" class="btn btn-brass btn-sm">Generate posts</a></div>`}
        </div>
        <div class="drawer-foot">
          <a href="ai-generation.html" class="btn btn-secondary">+ Add post to this day</a>
        </div>
      `;
      openDrawer('dayOverlay','dayDrawer');
    }
  </script>
</body>
</html>
